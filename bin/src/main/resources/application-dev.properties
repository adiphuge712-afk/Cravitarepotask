# Local development profile.
# Like the prod profile, every value below comes ONLY from an environment
# variable - no inline fallback. Load ../dev.env (see that file) before
# running, e.g. `set -a && source dev.env && set +a && ./mvnw spring-boot:run`,
# or point your IDE run config at it. dev.env holds only non-secret, safe
# local values, but this file itself must never gain a real secret as a
# ":fallback" either - that's the one thing that must never come back.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

frontend.url=${FRONTEND_URL}
jwt.secret=${JWT_SECRET_KEY}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8056

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# ---------- password-reset email (SMTP) ----------
# Mail is OFF by default: the code is written to the application log instead
# of being sent, so the reset flow works with no mail server configured at
# all. Export MAIL_ENABLED=true plus real MAIL_USERNAME/MAIL_PASSWORD in your
# own shell to test real delivery - never put real credentials in this file.
app.name=Cravita Sports Academy
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
