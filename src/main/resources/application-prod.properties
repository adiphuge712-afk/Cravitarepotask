# Production profile.
#
# Every value below comes ONLY from an environment variable - none of them
# has a ':fallback' default. If a required variable is missing, Spring fails
# to start with "Could not resolve placeholder '...'" instead of silently
# falling back to a value that might point at the wrong database, accept the
# wrong origin, or sign tokens with a guessable key. Failing loudly at boot
# is the point: a misconfigured prod deployment should never come up "working"
# against the wrong thing.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

frontend.url=${FRONTEND_URL}
jwt.secret=${JWT_SECRET_KEY}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT}

# ---------- password-reset email (SMTP) ----------
app.name=Cravita Sports Academy
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
