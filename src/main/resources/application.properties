spring.application.name=task_of_cravita

spring.profiles.active=dev

# Only "health" is exposed, not the full actuator surface (env, beans, etc.) -
# this is a public, unauthenticated endpoint (see SecurityConfig), so nothing
# more sensitive than up/down should ever be reachable through it.
management.endpoints.web.exposure.include=health

# The default mail health check opens a real SMTP connection and folds any
# failure into the overall health status - so a slow/unreachable mail server,
# or MAIL_ENABLED=false with blank credentials (the dev default), would flip
# the whole app to DOWN and get it killed by a container HEALTHCHECK or
# orchestrator, even though HTTP traffic is served fine. Password-reset email
# is a secondary feature, not something the app's liveness should hinge on.
management.health.mail.enabled=false
